[project]
name = "vggsfm"
version = "2.0.0"
authors = [{ name = "Jianyuan Wang" }]
description = "A package for the VGGSfM project."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE.txt" }
urls = { homepage = "https://github.com/facebookresearch/vggsfm.git" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy (>=1.26.0,<2.0.0)",
    "scipy (>=1.15.3,<2.0.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "omegaconf (>=2.3.0,<3.0.0)",
    "opencv-python (>=4.11.0.86,<5.0.0.0)",
    "einops (>=0.8.1,<0.9.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "plotly (>=6.1.2,<7.0.0)",
    "scikit-learn (>=1.7.0,<2.0.0)",
    "imageio[ffmpeg] (>=2.37.0,<3.0.0)",
    "gradio (>=5.34.2,<6.0.0)",
    "trimesh (>=4.6.12,<5.0.0)",
    "huggingface-hub (>=0.33.0,<0.34.0)",
    "poselib (>=2.0.4,<3.0.0)",
    "fvcore (>=0.1.5.post20221221,<0.2.0)",
    "iopath (>=0.1.10,<0.2.0)",
    "joblib (>=1.5.1,<2.0.0)",
    "coloredlogs (>=15.0.1,<16.0.0)",
    "rich (>=14.0.0,<15.0.0)",
    "torch (>=2.6.0,<2.7.0)",
    "torchvision (>=0.21.0,<0.22.0)",
    "pycolmap>=3.12.4",
    "pyceres>=2.5",
    "lightglue",
]

[dependency-groups]
dev = [
    "flake8-pyproject>=1.2.3",
    "mypy>=1.17.1",
    "ruff>=0.12.10",
]

[tool.uv.sources]
lightglue =  { path = "dependency/LightGlue" }
torch = [
    { marker = "sys_platform == 'win32'", index = "pytorch-cu124" },
    { marker = "sys_platform == 'linux'", index = "pytorch-cu124" },
    { marker = "sys_platform == 'darwin'", index = "pytorch-cpu" },
]
torchvision = [
    { marker = "sys_platform == 'win32'", index = "pytorch-cu124" },
    { marker = "sys_platform == 'linux'", index = "pytorch-cu124" },
    { marker = "sys_platform == 'darwin'", index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true


[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
length-sort = true
length-sort-straight = true


[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
plugins = ["numpy.typing.mypy_plugin"]
disallow_any_generics = true
strict_optional = true
check_untyped_defs = true
allow_redefinition = true

[tool.flake8]
max-line-length = 120
ignore = "Q000,E127,E203,E402,W503,W504"
